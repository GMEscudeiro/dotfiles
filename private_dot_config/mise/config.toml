# Ferramentas globais (sem sudo); `mise install` roda sozinho no chezmoi apply quando este arquivo muda
[tools]
node = "24"

# CLI
delta = "latest"      # diff do git
eza = "latest"        # ls
btop = "latest"       # monitor de sistema
gh = "latest"         # GitHub CLI
tealdeer = "latest"   # tldr
# gerenciador de arquivos; build musl porque o gnu exige glibc 2.39 (o 22.04 tem 2.35)
"github:sxyazi/yazi" = { version = "latest", asset_pattern = "yazi-x86_64-unknown-linux-musl.zip" }

# Desktop
"github:erebe/greenclip" = "latest"  # histórico do clipboard (rofi)
