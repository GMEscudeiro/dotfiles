#!/usr/bin/env bash
# O btop reescreve o btop.conf ao sair; o chezmoi só força o tema e mantém o resto.
conf=$(cat)
if [[ -z "$conf" ]]; then
    printf 'color_theme = "catppuccin_macchiato"\ntheme_background = false\n'
    exit 0
fi
sed -E -e 's|^color_theme = .*|color_theme = "catppuccin_macchiato"|' \
       -e 's|^theme_background = .*|theme_background = false|' <<< "$conf"
