[settings]
screenchange-reload = true

[bar/mybar]
scroll-up = "#i3.prev"
scroll-down = "#i3.next"
bottom = false
width = 100%
height = 25
offset-x = 0
offset-y = 0
modules-left = i3

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = false
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true
