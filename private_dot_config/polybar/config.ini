[settings]
screenchange-reload = true

[global/wm]
include-file = $HOME/.config/polybar/macchiato.ini

[bar/mybar]
scroll-up = "#i3.prev"
scroll-down = "#i3.next"
bottom = false
width = 100%
height = 25
offset-x = 0
offset-y = 0
modules-left = i3
modules-right = date
padding = 1

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = false
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

[module/date]
type = internal/date
interval = 1.0
date = %Y-%m-%d%
time = %H:%M
date-alt = %A, %d %B %Y
time-alt = %H:%M:%S
