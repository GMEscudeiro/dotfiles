;   go to https://github.com/polybar/polybar
;
;   The README contains a lot of information
;
;==========================================================
;
[colors]
rosewater = #f4dbd6
flamingo = #f0c6c6
pink = #f5bde6
mauve = #c6a0f6
red = #ed8796
maroon = #ee99a0
peach = #f5a97f
yellow = #eed49f
green = #a6da95
teal = #8bd5ca
sky = #91d7e3
sapphire = #7dc4e4
blue = #8aadf4
lavender = #b7bdf8
text = #cad3f5
subtext1 = #b8c0e0
subtext0 = #a5adcb
overlay2 = #939ab7
overlay1 = #8087a2
overlay0 = #6e738d
surface2 = #5b6078
surface1 = #494d64
surface0 = #363a4f
base = #24273a
mantle = #1e2030
crust = #181926
transparent = #00000000

; aliases semânticos
primary = ${self.mauve}
secondary = ${self.teal}
alert = ${self.red}
disabled = ${self.overlay0}

[bar/base]
width = 100%
height = 18pt
radius = 6

monitor = ${env:MONITOR:}

background = #cc181926
foreground = ${colors.text}

line-size = 2pt

padding-left = 1
padding-right = 2

module-margin = 1

separator = "·"
separator-foreground = ${colors.surface2}

; MesloLGS NF está instalada em ~/.local/share/fonts (tem os ícones Nerd)
font-0 = MesloLGS NF:size=10;3
font-1 = MesloLGS NF:size=12;3

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[bar/pbar]
inherit = bar/base

modules-left = i3
modules-center = xwindow
modules-right = player pulseaudio memory cpu date tray-toggle systray

[bar/sbar]
inherit = bar/base
foreground = ${colors.subtext0}

modules-left = i3
modules-center = xwindow
modules-right = pulseaudio memory cpu date

[module/systray]
type = internal/tray
; começa recolhido; o botão tray-toggle mostra/esconde
hidden = true

format-margin = 4pt
tray-spacing = 8pt

[module/tray-toggle]
; hook-0 = recolhido (seta p/ expandir), hook-1 = expandido
type = custom/ipc
hook-0 = echo ""
hook-1 = echo ""
initial = 1
format-foreground = ${colors.overlay2}
click-left = polybar-msg action "#systray.module_toggle" >/dev/null; polybar-msg action "#tray-toggle.next" >/dev/null

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

label-focused = %name%
label-focused-foreground = ${colors.mauve}
label-focused-background = ${colors.surface0}
label-focused-underline = ${colors.mauve}
label-focused-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.lavender}
label-visible-underline = ${colors.surface2}
label-visible-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.overlay1}
label-unfocused-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.crust}
label-urgent-background = ${colors.red}
label-urgent-padding = 1

label-mode = %mode%
label-mode-foreground = ${colors.crust}
label-mode-background = ${colors.peach}
label-mode-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:…%
label-foreground = ${colors.subtext0}

[module/player]
type = custom/script
exec = playerctl metadata --follow --format '{{status}}|{{artist}} - {{title}}' 2>/dev/null | while IFS='|' read -r st txt; do txt=$(printf '%.40s' "$txt"); case "$st" in Playing) echo "%{F#a6da95}󰐊%{F-} $txt";; Paused) echo "%{F#6e738d}󰏤 $txt%{F-}";; *) echo "";; esac; done
tail = true
click-left = playerctl play-pause
click-right = playerctl next
scroll-up = playerctl next
scroll-down = playerctl previous

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.yellow}
label-mounted = %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
click-right = pavucontrol &

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.sapphire}

format-muted = <label-muted>
label-muted = 󰝟 mudo
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

format-prefix = "󰌌 "
format-prefix-foreground = ${colors.lavender}
label-layout = %layout%

label-indicator-padding = 1
label-indicator-margin = 1
label-indicator-foreground = ${colors.crust}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.green}
format-warn-prefix = "󰍛 "
format-warn-prefix-foreground = ${colors.alert}
warn-percentage = 85
label = %percentage_used:2%%
label-warn = %percentage_used:2%%
label-warn-foreground = ${colors.alert}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.peach}
format-warn-prefix = "󰻠 "
format-warn-prefix-foreground = ${colors.alert}
warn-percentage = 90
label = %percentage:2%%
label-warn = %percentage:2%%
label-warn-foreground = ${colors.alert}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = 󰈂 offline
label-disconnected-foreground = ${colors.alert}

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#8bd5ca}󰖩%{F-} %essid%

[module/eth]
inherit = network-base
interface = enp6s0
label-connected = %{F#8bd5ca}󰈀%{F-} %downspeed:8% %{F#6e738d}↓↑%{F-} %upspeed:-8%

[module/battery]
; desktop sem bateria — mantido caso rode em notebook
type = internal/battery
battery = BAT0
adapter = AC0
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 󰁹 %percentage%%
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
animation-charging-0 = 󰢜
animation-charging-1 = 󰂇
animation-charging-2 = 󰢝
animation-charging-3 = 󰂅
animation-charging-framerate = 750

[module/date]
type = internal/date
interval = 1

date = %a %d/%m
time = %H:%M
date-alt = %A, %d de %B de %Y
time-alt = %H:%M:%S

format-prefix = "󰃭 "
format-prefix-foreground = ${colors.mauve}
label = %date%  %time%
label-foreground = ${colors.text}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
