# Dependências externas baixadas pelo `chezmoi apply` (em vez de versionar cópias no repo).
# Forçar atualização: chezmoi apply --refresh-externals

# ── tmux ──────────────────────────────────────────────────────────────────────
[".config/tmux/plugins/catppuccin/tmux"]
    type = "archive"
    url = "https://github.com/catppuccin/tmux/archive/refs/tags/v2.1.3.tar.gz"
    stripComponents = 1
    exact = true

[".config/tmux/plugins/tmux-battery"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tmux-battery/archive/master.tar.gz"
    stripComponents = 1
    exact = true
    refreshPeriod = "168h"

[".config/tmux/plugins/tmux-cpu"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tmux-cpu/archive/master.tar.gz"
    stripComponents = 1
    exact = true
    refreshPeriod = "168h"

# ── zsh (plugins custom do oh-my-zsh) ─────────────────────────────────────────
[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-autosuggestions/archive/master.tar.gz"
    stripComponents = 1
    exact = true
    refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/master.tar.gz"
    stripComponents = 1
    exact = true
    refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/zsh-completions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-completions/archive/master.tar.gz"
    stripComponents = 1
    exact = true
    refreshPeriod = "168h"

[".config/tmux/plugins/tmux-resurrect"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tmux-resurrect/archive/master.tar.gz"
    stripComponents = 1
    exact = true
    refreshPeriod = "168h"

[".config/tmux/plugins/tmux-continuum"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tmux-continuum/archive/master.tar.gz"
    stripComponents = 1
    exact = true
    refreshPeriod = "168h"

# ── Tema Catppuccin Macchiato ─────────────────────────────────────────────────
# bat e delta (o run_onchange roda `bat cache --build`)
[".config/bat/themes/Catppuccin Macchiato.tmTheme"]
    type = "file"
    url = "https://raw.githubusercontent.com/catppuccin/bat/main/themes/Catppuccin%20Macchiato.tmTheme"
    refreshPeriod = "720h"

[".config/btop/themes/catppuccin_macchiato.theme"]
    type = "file"
    url = "https://raw.githubusercontent.com/catppuccin/btop/main/themes/catppuccin_macchiato.theme"
    refreshPeriod = "720h"

# GTK (o repo foi arquivado; v1.0.3 é a release final)
[".themes"]
    type = "archive"
    url = "https://github.com/catppuccin/gtk/releases/download/v1.0.3/catppuccin-macchiato-mauve-standard+default.zip"
    include = ["catppuccin-macchiato-mauve-standard+default", "catppuccin-macchiato-mauve-standard+default/**"]

# ── Fonte ─────────────────────────────────────────────────────────────────────
[".local/share/fonts/JetBrainsMono"]
    type = "archive"
    url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/JetBrainsMono.tar.xz"
    include = ["*.ttf"]

# ── Lock screen (precisa do i3lock-color; ver scripts/bootstrap.sh) ───────────
[".local/bin/betterlockscreen"]
    type = "file"
    url = "https://raw.githubusercontent.com/betterlockscreen/betterlockscreen/v4.4.0/betterlockscreen"
    executable = true
